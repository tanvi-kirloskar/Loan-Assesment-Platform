name: Docker Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-smoke.yml"

  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-smoke.yml"

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U loan_user -d loan_db; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run database migrations
        run: docker compose exec -T backend alembic upgrade head

      - name: Check backend health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Check frontend
        run: curl --fail --silent http://localhost/ | grep -q "<html"

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
